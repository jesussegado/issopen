name: Chrome validation and private artifact
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  chrome:
    # Requires an isolated runner with Docker for disposable PostgreSQL tests.
    # No production credentials, deploy key, kubeconfig or personal browser.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Prepare toolchain and browsers
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm install --frozen-lockfile
          docker info >/dev/null
          pnpm exec playwright install --with-deps chromium
      - name: Validate and package production extension
        run: pnpm extension:release
      - name: Upload only validated ZIP, checksum and manifest
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: issopen-chrome
          path: extensions/chrome/.output/releases/*
          if-no-files-found: error
          retention-days: 30
