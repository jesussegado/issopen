packages:
  - "."
  - "extensions/chrome"

# Preserve CIMD DNS pinning while honoring Node 24's all:true lookup contract.
patchedDependencies:
  '@better-auth/cimd@1.7.2': patches/@better-auth__cimd@1.7.2.patch

allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  # Pinned, reviewed SMTP multiline-reply hardening (2026-09-14); no dependencies
  # or install scripts. Scope stays this exact release, not the whole package.
  - nodemailer@10.0.10
